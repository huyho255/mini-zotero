<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>MiniZotero PDF Viewer</title>
  <style>
    html,
    body {
      height: 100%;
      margin: 0;
      overflow: hidden;
      background: #d1d5db;
      color: #111827;
      font-family: "Segoe UI", Arial, sans-serif;
    }

    #toolbar {
      height: 42px;
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 0 10px;
      background: #ffffff;
      border-bottom: 1px solid #e5e7eb;
      box-sizing: border-box;
    }

    button {
      height: 28px;
      min-width: 32px;
      border: 1px solid #cbd5e1;
      border-radius: 4px;
      background: #f8fafc;
      color: #111827;
      font-size: 13px;
      cursor: pointer;
    }

    button:hover {
      background: #e5e7eb;
    }

    #zoomText {
      min-width: 54px;
      text-align: center;
      color: #475569;
      font-size: 12px;
    }

    #status {
      margin-left: auto;
      color: #64748b;
      font-size: 12px;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #viewerContainer {
      height: calc(100% - 42px);
      overflow: auto;
      padding: 18px 0;
      box-sizing: border-box;
    }

    .page {
      display: block;
      margin: 0 auto 18px;
      background: white;
      box-shadow: 0 8px 24px rgba(15, 23, 42, 0.18);
    }

    #message {
      padding: 24px;
      text-align: center;
      color: #64748b;
      font-size: 13px;
    }
  </style>
</head>
<body>
  <div id="toolbar">
    <button id="zoomOut" title="Zoom out">-</button>
    <span id="zoomText">100%</span>
    <button id="zoomIn" title="Zoom in">+</button>
    <button id="fitWidth" title="Fit width">Fit</button>
    <span id="status">Loading...</span>
  </div>

  <div id="viewerContainer">
    <div id="message">Loading PDF...</div>
    <div id="pages"></div>
  </div>

  <script type="module">
    import * as pdfjsLib from "../build/pdf.mjs";

    pdfjsLib.GlobalWorkerOptions.workerSrc = "../build/pdf.worker.mjs";

    const params = new URLSearchParams(window.location.search);
    const file = params.get("file");
    const pagesElement = document.getElementById("pages");
    const container = document.getElementById("viewerContainer");
    const message = document.getElementById("message");
    const status = document.getElementById("status");
    const zoomText = document.getElementById("zoomText");
    const zoomOut = document.getElementById("zoomOut");
    const zoomIn = document.getElementById("zoomIn");
    const fitWidth = document.getElementById("fitWidth");

    let pdfDocument = null;
    let scale = 1;
    let renderToken = 0;

    function updateZoomText() {
      zoomText.textContent = `${Math.round(scale * 100)}%`;
    }

    function setMessage(text) {
      message.textContent = text;
      message.style.display = text ? "block" : "none";
    }

    async function renderPages() {
      if (!pdfDocument) {
        return;
      }

      const token = ++renderToken;
      pagesElement.replaceChildren();
      setMessage("Rendering PDF...");
      updateZoomText();

      for (let pageNumber = 1; pageNumber <= pdfDocument.numPages; pageNumber++) {
        if (token !== renderToken) {
          return;
        }

        const page = await pdfDocument.getPage(pageNumber);
        const viewport = page.getViewport({ scale });
        const canvas = document.createElement("canvas");
        const context = canvas.getContext("2d");
        const outputScale = window.devicePixelRatio || 1;

        canvas.className = "page";
        canvas.width = Math.floor(viewport.width * outputScale);
        canvas.height = Math.floor(viewport.height * outputScale);
        canvas.style.width = `${Math.floor(viewport.width)}px`;
        canvas.style.height = `${Math.floor(viewport.height)}px`;

        context.setTransform(outputScale, 0, 0, outputScale, 0, 0);
        pagesElement.appendChild(canvas);

        await page.render({ canvasContext: context, viewport }).promise;
      }

      setMessage("");
      status.textContent = `${pdfDocument.numPages} page(s)`;
    }

    function setScale(nextScale) {
      scale = Math.min(3, Math.max(0.4, nextScale));
      renderPages();
    }

    async function fitToWidth() {
      if (!pdfDocument) {
        return;
      }

      const page = await pdfDocument.getPage(1);
      const viewport = page.getViewport({ scale: 1 });
      const availableWidth = Math.max(320, container.clientWidth - 48);
      setScale(availableWidth / viewport.width);
    }

    zoomOut.addEventListener("click", () => setScale(scale - 0.1));
    zoomIn.addEventListener("click", () => setScale(scale + 0.1));
    fitWidth.addEventListener("click", fitToWidth);

    container.addEventListener("wheel", event => {
      if (!event.ctrlKey) {
        return;
      }

      event.preventDefault();
      setScale(scale + (event.deltaY < 0 ? 0.1 : -0.1));
    }, { passive: false });

    if (!file) {
      setMessage("No PDF file was provided.");
    } else {
      try {
        status.textContent = "Opening PDF...";
        const loadingTask = pdfjsLib.getDocument(file);
        loadingTask.onProgress = progress => {
          if (!progress.total) {
            return;
          }

          const percent = Math.round((progress.loaded / progress.total) * 100);
          status.textContent = `Loading ${percent}%`;
        };

        pdfDocument = await loadingTask.promise;
        await fitToWidth();
      } catch (error) {
        console.error(error);
        status.textContent = "Failed to load PDF";
        setMessage(`Could not load this PDF file. ${error?.message ?? ""}`);
      }
    }
  </script>
</body>
</html>
